name: Validate and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JSON syntax
        run: |
          echo "Validating marketplace.json..."
          jq . .claude-plugin/marketplace.json > /dev/null
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            echo "Validating $manifest..."
            jq . "$manifest" > /dev/null
          done

      - name: Validate plugin/marketplace alignment
        run: |
          jq -c '.plugins[]' .claude-plugin/marketplace.json | while read -r entry; do
            NAME=$(printf '%s' "$entry" | jq -r '.name')
            SOURCE=$(printf '%s' "$entry" | jq -r '.source')
            MARKET_VERSION=$(printf '%s' "$entry" | jq -r '.version')
            MANIFEST="${SOURCE#./}/.claude-plugin/plugin.json"

            if [ ! -f "$MANIFEST" ]; then
              echo "ERROR: $MANIFEST not found for marketplace plugin '$NAME'"
              exit 1
            fi

            PLUGIN_NAME=$(jq -r '.name' "$MANIFEST")
            PLUGIN_VERSION=$(jq -r '.version' "$MANIFEST")

            if [ "$PLUGIN_NAME" != "$NAME" ]; then
              echo "ERROR: name mismatch for '$NAME'"
              echo "  marketplace.json: $NAME"
              echo "  $MANIFEST: $PLUGIN_NAME"
              exit 1
            fi

            if [ "$PLUGIN_VERSION" != "$MARKET_VERSION" ]; then
              echo "ERROR: version mismatch for '$NAME'"
              echo "  $MANIFEST: $PLUGIN_VERSION"
              echo "  marketplace.json: $MARKET_VERSION"
              exit 1
            fi
            echo "OK: $NAME @ $PLUGIN_VERSION"
          done

          for manifest in plugins/*/.claude-plugin/plugin.json; do
            NAME=$(jq -r '.name' "$manifest")
            LISTED=$(jq -r --arg n "$NAME" \
              '.plugins[] | select(.name == $n) | .name' \
              .claude-plugin/marketplace.json)
            if [ -z "$LISTED" ]; then
              echo "ERROR: plugin '$NAME' ($manifest) not listed in marketplace.json"
              exit 1
            fi
          done

      - name: Validate the shared version
        run: |
          GLOBAL_VERSION=""
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            VERSION=$(jq -r '.version' "$manifest")
            if [ -z "$GLOBAL_VERSION" ]; then
              GLOBAL_VERSION="$VERSION"
            elif [ "$VERSION" != "$GLOBAL_VERSION" ]; then
              echo "ERROR: every plugin must carry the same version"
              echo "  $manifest: $VERSION"
              echo "  expected: $GLOBAL_VERSION"
              exit 1
            fi
          done
          echo "OK: all plugins at $GLOBAL_VERSION"

      - name: Validate Codex manifests
        run: |
          echo "Validating .agents/plugins/marketplace.json..."
          jq . .agents/plugins/marketplace.json > /dev/null
          for manifest in plugins/*/plugin.json; do
            echo "Validating $manifest..."
            jq . "$manifest" > /dev/null
          done

          status=0
          for dir in plugins/*/; do
            plugin_root="${dir%/}"
            NAME=$(basename "$plugin_root")
            SOURCE=$(jq -r --arg n "$NAME" \
              '.plugins[] | select(.name == $n) | .source.path' \
              .agents/plugins/marketplace.json)
            if [ -z "$SOURCE" ]; then
              echo "ERROR: plugin '$NAME' not listed in .agents/plugins/marketplace.json"
              status=1
            elif [ "${SOURCE#./}" != "$plugin_root" ]; then
              echo "ERROR: Codex marketplace entry '$NAME' points at '$SOURCE', expected './$plugin_root'"
              status=1
            fi

            CLAUDE_MANIFEST="$plugin_root/.claude-plugin/plugin.json"
            CODEX_MANIFEST="$plugin_root/plugin.json"
            if [ ! -f "$CODEX_MANIFEST" ]; then
              echo "ERROR: $CODEX_MANIFEST missing — Codex reads it; copy name and version from $CLAUDE_MANIFEST"
              status=1
              continue
            fi
            for field in name version; do
              CLAUDE_VALUE=$(jq -r ".$field" "$CLAUDE_MANIFEST")
              CODEX_VALUE=$(jq -r ".$field" "$CODEX_MANIFEST")
              if [ "$CLAUDE_VALUE" != "$CODEX_VALUE" ]; then
                echo "ERROR: $field mismatch for '$NAME'"
                echo "  $CLAUDE_MANIFEST: $CLAUDE_VALUE"
                echo "  $CODEX_MANIFEST: $CODEX_VALUE"
                status=1
              fi
            done
            echo "OK: $NAME listed for Codex, manifests agree"
          done
          exit $status

      - name: Validate the CLAUDE.md symlink
        run: |
          # CLAUDE.md must stay a symlink to AGENTS.md. A checkout with
          # core.symlinks=false, or a plain `ln -s` under Git Bash, replaces
          # the link with a copy, and the two files then drift apart.
          ENTRY=$(git ls-files -s CLAUDE.md)
          MODE=$(printf '%s' "$ENTRY" | awk '{print $1}')
          if [ "$MODE" != "120000" ]; then
            echo "ERROR: CLAUDE.md is tracked with mode '${MODE:-none}', expected 120000 (symlink)"
            echo "  recreate it with: MSYS=winsymlinks:nativestrict ln -sf AGENTS.md CLAUDE.md"
            exit 1
          fi
          TARGET=$(git cat-file -p "$(printf '%s' "$ENTRY" | awk '{print $2}')")
          if [ "$TARGET" != "AGENTS.md" ]; then
            echo "ERROR: CLAUDE.md links to '$TARGET', expected AGENTS.md"
            exit 1
          fi
          if [ ! -f AGENTS.md ]; then
            echo "ERROR: AGENTS.md is missing"
            exit 1
          fi
          echo "OK: CLAUDE.md -> AGENTS.md"

      - name: Validate skill references
        run: |
          echo "Checking skill folders..."
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            plugin_root=$(dirname "$(dirname "$manifest")")
            jq -r '.skills[]' "$manifest" | while read -r source; do
              clean_source="${source#./}"
              file="${plugin_root}/${clean_source}/SKILL.md"
              if [ ! -f "$file" ]; then
                echo "ERROR: Missing SKILL.md: $file"
                exit 1
              fi
              echo "OK: $file"
            done
          done

      - name: Validate YAML frontmatter
        run: |
          echo "Checking YAML frontmatter in skills..."
          find plugins/*/skills -name "SKILL.md" | while read -r file; do
            if ! head -1 "$file" | grep -q "^---$"; then
              echo "ERROR: Missing YAML frontmatter in $file"
              exit 1
            fi
            frontmatter=$(awk '/^---$/{c++; next} c==1' "$file")
            if [ -z "$frontmatter" ]; then
              echo "ERROR: Empty or unterminated YAML frontmatter in $file"
              exit 1
            fi
            if ! printf '%s\n' "$frontmatter" | grep -q "^name:"; then
              echo "ERROR: Missing 'name' in $file frontmatter"
              exit 1
            fi
            if ! printf '%s\n' "$frontmatter" | grep -q "^description:"; then
              echo "ERROR: Missing 'description' in $file frontmatter"
              exit 1
            fi
            dir_name=$(basename "$(dirname "$file")")
            skill_name=$(printf '%s\n' "$frontmatter" | grep -m1 "^name:" | sed 's/^name: *//')
            if [ "$dir_name" != "$skill_name" ]; then
              echo "ERROR: directory name '$dir_name' does not match skill name '$skill_name' in $file"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Validate skill metadata
        run: |
          # Every skill carries agents/openai.yaml for Codex. A user-invoked
          # skill is marked twice — disable-model-invocation: true for Claude
          # Code, policy.allow_implicit_invocation: false for Codex — and the
          # two must agree, or the skill auto-fires on one agent and not the
          # other.
          status=0
          for dir in plugins/*/skills/*/; do
            skill_dir="${dir%/}"
            skill="$skill_dir/SKILL.md"
            yaml="$skill_dir/agents/openai.yaml"
            if [ ! -f "$yaml" ]; then
              echo "ERROR: $skill_dir has no agents/openai.yaml"
              status=1
              continue
            fi
            if ! grep -q '^  display_name:' "$yaml" || ! grep -q '^  short_description:' "$yaml"; then
              echo "ERROR: $yaml needs interface.display_name and interface.short_description"
              status=1
            fi
            frontmatter=$(awk '/^---$/{c++; next} c==1' "$skill")
            if printf '%s\n' "$frontmatter" | grep -q '^disable-model-invocation: *true'; then
              claude_user_invoked=yes
            else
              claude_user_invoked=no
            fi
            if grep -q '^  allow_implicit_invocation: *false' "$yaml"; then
              codex_user_invoked=yes
            else
              codex_user_invoked=no
            fi
            if [ "$claude_user_invoked" != "$codex_user_invoked" ]; then
              echo "ERROR: $skill_dir: disable-model-invocation: true ($claude_user_invoked) and allow_implicit_invocation: false ($codex_user_invoked) must be set together"
              status=1
            else
              echo "OK: $skill_dir"
            fi
          done
          exit $status

      - name: Validate shared reference files
        run: |
          echo "Checking skill references..."

          # A `plugins/<plugin>/skills/<skill>/references/*.md` file is prose a
          # skill reads at runtime. When two skills share it, one owns the file
          # and the other names it as `../<owner>/references/<name>.md`.
          # Nothing loads it for them — no manifest entry, no include
          # mechanism — so each skill names the path in its body and the agent
          # does the read. That leaves both halves of the link breakable with
          # nothing to report it: a renamed file leaves the reader pointing at
          # nothing, and a renamed or deleted reader can leave the file with no
          # one naming it. Either way the shared rules stop reaching the skills
          # that need them, silently. So check the link from both ends.
          #
          # This cannot catch a read that fails at runtime — that is why the
          # skills themselves report a failed read (see AGENTS.md, manifest
          # layout). It catches the rename that causes one.

          status=0

          # Forward — every sibling reference path a SKILL.md names must
          # resolve. The path is written relative to the SKILL.md, so resolve
          # it from that file's own directory.
          while read -r file; do
            skill_dir=$(dirname "$file")
            while read -r rel; do
              [ -n "$rel" ] || continue
              if [ -f "$skill_dir/$rel" ]; then
                echo "OK: $file reads $rel"
              else
                echo "ERROR: $file names a reference that does not exist: $rel"
                echo "  resolved to $skill_dir/$rel"
                echo "  fix the path, or restore the file the skill expects"
                status=1
              fi
            done < <(grep -o '\.\./[A-Za-z0-9._-]*/references/[A-Za-z0-9._-]*\.md' "$file" | sort -u)
          done < <(find plugins/*/skills -name "SKILL.md")

          # Reverse — every reference file must be named by its owner or by a
          # sibling skill in the same plugin.
          for ref in plugins/*/skills/*/references/*.md; do
            [ -f "$ref" ] || continue
            plugin_skills=$(dirname "$(dirname "$(dirname "$ref")")")
            name=$(basename "$ref")
            if grep -rqF --include=SKILL.md "references/$name" "$plugin_skills"; then
              echo "OK: $ref has a reader"
            else
              echo "ERROR: no skill in $plugin_skills reads $ref"
              echo "  a reference with no readers is dead prose — name it"
              echo "  from the skill that needs it, or delete it"
              status=1
            fi
          done

          # A plugin-level references directory is unreachable from a skill
          # installed on its own (skills.sh copies only the skill directory).
          for dir in plugins/*/references; do
            [ -d "$dir" ] || continue
            echo "ERROR: $dir exists — move its files into the owning skill's references/"
            status=1
          done

          exit $status

      - name: Summary
        run: |
          echo "=== Marketplace Summary ==="
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            echo "Plugin: $(jq -r '.name' "$manifest") @ $(jq -r '.version' "$manifest") ($(jq '.skills | length' "$manifest") skills)"
          done

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the tag matches the shared version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          VERSION=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "ERROR: tag v$TAG_VERSION does not match the plugin version $VERSION"
            exit 1
          fi
          echo "OK: tag v$TAG_VERSION matches every plugin"

      - name: Generate release notes
        run: |
          MARKET_NAME=$(jq -r '.name' .claude-plugin/marketplace.json)
          VERSION=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)

          cat > notes.md << HEADER
          ## What's in this release

          Every plugin ships at **$VERSION** — they share one version, so a
          release moves all of them whether or not each one changed.

          HEADER

          for manifest in plugins/*/.claude-plugin/plugin.json; do
            plugin_root=$(dirname "$(dirname "$manifest")")
            PLUGIN_NAME=$(jq -r '.name' "$manifest")
            SKILLS=$(jq '.skills | length' "$manifest")

            echo "### \`$PLUGIN_NAME\` ($SKILLS skills)" >> notes.md
            echo "" >> notes.md
            jq -r '.skills[]' "$manifest" | while read -r source; do
              clean_source="${source#./}"
              file="${plugin_root}/${clean_source}/SKILL.md"
              if [ -f "$file" ]; then
                frontmatter=$(awk '/^---$/{c++; next} c==1' "$file")
                skill_name=$(printf '%s\n' "$frontmatter" | grep -m1 "^name:" | sed 's/^name: *//')
                skill_desc=$(printf '%s\n' "$frontmatter" | awk '/^description:/{v=$0;sub(/^description:[ \t]*/,"",v);if(v~/^[|>][0-9+-]*[ \t]*$/)v="";d=v;f=1;next} f&&/^[^ \t]/{f=0} f{s=$0;sub(/^[ \t]+/,"",s);if(s!="")d=(d==""?s:d" "s)} END{print d}' | head -c 200)
                echo "- \`$skill_name\`: ${skill_desc}" >> notes.md
              fi
            done
            echo "" >> notes.md
          done

          cat >> notes.md << INSTALL
          ## Installation

          Run these inside Claude Code:

          \`\`\`text
          /plugin marketplace add $GITHUB_REPOSITORY
          INSTALL

          for manifest in plugins/*/.claude-plugin/plugin.json; do
            echo "/plugin install $(jq -r '.name' "$manifest")@$MARKET_NAME" >> notes.md
          done

          cat >> notes.md << 'FOOT'
          ```

          Install only the plugins you want — they toggle independently.
          FOOT

          cat >> notes.md << SKILLS

          For Codex and other agents, with [skills.sh](https://skills.sh):

          \`\`\`sh
          npx skills@latest add $GITHUB_REPOSITORY
          # or one bucket at a time:
          SKILLS

          for manifest in plugins/*/.claude-plugin/plugin.json; do
            echo "npx skills@latest add $GITHUB_REPOSITORY/$(dirname "$(dirname "$manifest")")" >> notes.md
          done
          echo '```' >> notes.md

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "" >> notes.md
            echo "## Changes since $PREV_TAG" >> notes.md
            echo "" >> notes.md
            git log --oneline "$PREV_TAG"..HEAD >> notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: notes.md
          generate_release_notes: false
